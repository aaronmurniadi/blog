<!DOCTYPE html>
<html lang="{{or .Lang "en"}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="WueWgxazZfzyRmReKOxkb36Ub42Dz-ZLndfjb3HkzVs" />
    <title>{{if eq .Path "/"}}Beago Cirius{{else}}{{.Title}} · Beago Cirius{{end}}</title>
    {{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
    <link rel="canonical" href="{{.Canonical}}">
    <meta name="author" content="Aaron P. Murniadi">
    <meta name="robots" content="index, follow">
    <meta name="generator" content="Beago Cirius static site generator">

    <!-- Open Graph -->
    <meta property="og:site_name" content="{{.SiteName}}">
    <meta property="og:type" content="{{.Type}}">
    <meta property="og:title" content="{{if eq .Path "/"}}Beago Cirius{{else}}{{with .Title}}{{.}}{{else}}Beago Cirius{{end}}{{end}}">
    <meta property="og:description" content="{{with .Description}}{{.}}{{else}}Writing about technology, philosophy, photography, and document typesetting.{{end}}">
    <meta property="og:url" content="{{.Canonical}}">
    <meta property="og:image" content="{{absURL .Canonical (or .Image .SiteImage)}}">
    <meta property="og:locale" content="{{or .Lang "en"}}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@aaronpmurniadi">
    <meta name="twitter:title" content="{{if eq .Path "/"}}Beago Cirius{{else}}{{with .Title}}{{.}}{{else}}Beago Cirius{{end}}{{end}}">
    <meta name="twitter:description" content="{{.Description}}">
    <meta name="twitter:image" content="{{absURL .Canonical (or .Image .SiteImage)}}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>


    <script>hljs.highlightAll();</script>
    <script>
        const cache = new Map();

        document.addEventListener('click', e => {
            const a = e.target.closest('a[href^="/"]');
            if (!a) return;
            if (a.pathname.startsWith('/media/') || !cache.has(a.pathname)) return;
            e.preventDefault();
            const html = cache.get(a.pathname);
            const main = document.querySelector('main');
            main.innerHTML = html;
            history.pushState({}, '', a.pathname);
            window.scrollTo(0, 0);
            hljs.highlightAll();
        });
    </script>
</head>

<body>
    <div id="page">
        <header>
            <div class="site-brand">
                <img src="/beago-cirius-logo-white.svg" alt="" class="site-logo">
                <h1>Beago Cirius<span class="sub">Aaron P. Murniadi</span></h1>
            </div>
            <p class="site-tagline">technology · philosophy<br>photography · typesetting</p>
        </header>
        <nav>{{range .Nav}}<a href="{{.Path}}">{{.Title}}</a>{{end}}</nav>
        <main>
            {{.HTML}}
        </main>
        <footer>
            <p>© 2026 Aaron P. Murniadi</p>
        </footer>
    </div>
    <!-- TeX-quality hyphenation (Liang patterns) for justified body text.
         Only loads on wide screens AND only when this page has body text to hyphenate,
         so mobile pages never download the library. -->
    <script>
        (function () {
            var wide = window.matchMedia ? window.matchMedia('(min-width: 720px)') : null;

            function hasParaNum() {
                return !!document.querySelector('.para-num');
            }

            function load(src, next) {
                var s = document.createElement('script');
                s.async = true;
                s.src = src;
                s.onload = next;
                s.onerror = next;
                document.head.appendChild(s);
            }

            function run() {
                if (!window.createHyphenator) return;
                var lang = (document.documentElement.lang || 'en').toLowerCase().split('-')[0];
                var patterns = lang === 'id' ? window.hyphenationPatternsId
                    : window.hyphenationPatternsEnUs;
                if (!patterns) return;

                var hyphenate = window.createHyphenator(patterns, { leftmin: 2, rightmin: 3 });

                function hyphenateTexts(rootEl) {
                    if (!rootEl || (wide && !wide.matches) || !hasParaNum()) return;
                    var paras = rootEl.querySelectorAll('.para-num p');
                    for (var i = 0; i < paras.length; i++) {
                        walk(paras[i], function (text) {
                            return hyphenate(text);
                        });
                    }
                }

                // Hyphenate only text, skipping elements that must not change (links, code, pre, headings).
                function walk(node, fn) {
                    if (node.nodeType === 3) { // text node
                        if (node.nodeValue && node.nodeValue.trim()) {
                            node.nodeValue = fn(node.nodeValue);
                        }
                        return;
                    }
                    if (/^(A|CODE|PRE|SCRIPT|STYLE|H1|H2|H3|H4|H5|H6|FIGCAPTION|SUMMARY|TABLE)$/.test(node.nodeName)) return;
                    for (var i = 0; i < node.childNodes.length; i++) {
                        walk(node.childNodes[i], fn);
                    }
                }

                // Defer actual work so it never blocks first paint on wide screens.
                var defer = window.requestIdleCallback || function (cb) { setTimeout(cb, 0); };
                defer(function () {
                    hyphenateTexts(document);
                });

                // Re-hyphenate after SPA-style inline navigation swaps content.
                var main = document.querySelector('main');
                if (main) {
                    new MutationObserver(function () {
                        if ((!wide || wide.matches) && main.querySelector('.para-num')) {
                            hyphenateTexts(main);
                        }
                    }).observe(main, { childList: true, subtree: true });
                }
            }

            // Load the library only if warranted: wide screen AND article body present.
            if ((!wide || wide.matches) && hasParaNum()) {
                var whenReady = function () {
                    load('https://cdn.jsdelivr.net/npm/hyphen@1.14.1/hyphen.js', function () {
                        load('https://cdn.jsdelivr.net/npm/hyphen@1.14.1/patterns/id.js', function () {
                            load('https://cdn.jsdelivr.net/npm/hyphen@1.14.1/patterns/en-us.js', run);
                        });
                    });
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', whenReady);
                } else {
                    whenReady();
                }
            }
        })();
    </script>
    <script>
        hljs.highlightAll();
        document.querySelectorAll('.para-num p').forEach((p, i) => {
            if (i > 0) p.setAttribute('data-pnum', i);
        });
    </script>
</body>

</html>
