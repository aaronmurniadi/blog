<!DOCTYPE html>
<html lang="{{or .Lang "en"}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if eq .Path "/"}}Beago Cirius{{else}}{{.Title}} · Beago Cirius{{end}}</title>
    {{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
    <link rel="canonical" href="{{.Canonical}}">
    <meta name="author" content="Aaron P. Murniadi">
    <meta name="robots" content="index, follow">
    <meta name="generator" content="Beago Cirius static site generator">

    <!-- Open Graph -->
    <meta property="og:site_name" content="{{.SiteName}}">
    <meta property="og:type" content="{{.Type}}">
    <meta property="og:title" content="{{if eq .Path "/"}}Beago Cirius{{else}}{{with .Title}}{{.}}{{else}}Beago Cirius{{end}}{{end}}">
    <meta property="og:description" content="{{with .Description}}{{.}}{{else}}Writing about technology, philosophy, photography, and document typesetting.{{end}}">
    <meta property="og:url" content="{{.Canonical}}">
    <meta property="og:image" content="{{absURL .Canonical (or .Image .SiteImage)}}">
    <meta property="og:locale" content="{{or .Lang "en"}}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@aaronpmurniadi">
    <meta name="twitter:title" content="{{if eq .Path "/"}}Beago Cirius{{else}}{{with .Title}}{{.}}{{else}}Beago Cirius{{end}}{{end}}">
    <meta name="twitter:description" content="{{.Description}}">
    <meta name="twitter:image" content="{{absURL .Canonical (or .Image .SiteImage)}}">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>


    <script>hljs.highlightAll();</script>
    <script>
        const cache = new Map();

        document.addEventListener('click', e => {
            const a = e.target.closest('a[href^="/"]');
            if (!a) return;
            if (a.pathname.startsWith('/media/') || !cache.has(a.pathname)) return;
            e.preventDefault();
            const html = cache.get(a.pathname);
            const main = document.querySelector('main');
            main.innerHTML = html;
            history.pushState({}, '', a.pathname);
            window.scrollTo(0, 0);
            hljs.highlightAll();
        });
    </script>
</head>

<body>
    <div id="page">
        <header>
            <div class="site-brand">
                <img src="/beago-cirius-logo-white.svg" alt="" class="site-logo">
                <h1>Beago Cirius<span class="sub">Aaron P. Murniadi</span></h1>
            </div>
            <p class="site-tagline">technology · philosophy<br>photography · typesetting</p>
        </header>
        <nav>{{range .Nav}}<a href="{{.Path}}">{{.Title}}</a>{{end}}</nav>
        <main>
            {{.HTML}}
        </main>
        <footer>
            <p>© 2026 Aaron P. Murniadi</p>
        </footer>
    </div>
    <script>
        hljs.highlightAll();
        document.querySelectorAll('.para-num p').forEach((p, i) => {
            if (i > 0) p.setAttribute('data-pnum', i);
        });
    </script>
</body>

</html>
